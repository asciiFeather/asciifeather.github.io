<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forumspace</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>📝 Forumspace (Frank Ocean blog site)</h1>
    <ul id="post-list"></ul>
  </main>

  <script>
    // List of posts: title + file name
    const posts = [
      { title: "Frank Ocean", file: "frankocean.md" },
    ];

    const list = document.getElementById("post-list");
    posts.forEach(post => {
      const li = document.createElement("li");
      li.innerHTML = `<a href="post.html?file=${encodeURIComponent(post.file)}">${post.title}</a>`;
      list.appendChild(li);
    });
  </script>
</body>
</html>
